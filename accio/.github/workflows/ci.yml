name: ci

on:
  push:
  pull_request:
  workflow_dispatch:  # the skill evals run only from here: they spend API credit (S-026)

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python tests
        run: python3 -m unittest discover -s tests -v
      - name: Workflow tests
        run: node --test 'tests/workflow/**/*.test.mjs'

  evals:
    # One cheap case per skill (tag `ci`), free graders only, capped at $2 a run (DESIGN § 9, decision 006).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code and the sandbox it runs Bash in
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap socat
          npm install -g @anthropic-ai/claude-code@2.1.302  # the version the baseline was measured with
      - name: Skill evals
        # The key reaches this step only, and Bash is granted for this checkout's own scripts only: a script the
        # model under test writes elsewhere (say ./x/bin/accio-y) matches no grant.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: claude plugin eval . --tag ci --runs 1 --ablation none --scaffold --trust-plugin --allow-tools Write Edit "Bash(${{ github.workspace }}/bin/accio-* *)" --max-cost-usd 2
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/results/
